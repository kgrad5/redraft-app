[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redraft"
version = "0.1.0"
description = "Yahoo fantasy football draft assistant for one private league"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "starlette>=1.6",
    "uvicorn[standard]",
    "numpy",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "httpx2>=2.12",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/redraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
